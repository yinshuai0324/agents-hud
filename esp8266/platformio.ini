; AgentsHUD firmware for the "SmallDesktopDisplay" board:
; ESP8266 (ESP-12E / NodeMCU v2) + 1.54" ST7789v2 240x240 TFT.
; Board id: sdd154. No Bluetooth on ESP8266 — provisioning happens over USB
; serial from the Mac app (see ../docs/PROTOCOL.md §4b).
[env:sdd154]
platform = espressif8266@2.6.3
board = nodemcuv2
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bblanchon/ArduinoJson@^6.21.5
    ; 2.3.7 is the last release whose WebSocketsServer uses WiFiServer::available()
    ; instead of accept(); accept() only exists on ESP8266 core 3.x, but this
    ; board is pinned to platform 2.6.3 (core 2.7.4). We only use the client.
    links2004/WebSockets@2.3.7

; Firmware version from the repo-root VERSION file (single source of truth).
; TFT_eSPI is configured entirely from flags (no User_Setup.h edits): pin map
; and driver match the vendor's known-good setup for this board.
build_flags =
    !echo "-DAHUD_FW_VERSION=\\\"$(cat ../VERSION | tr -d '[:space:]')\\\""
    -DAHUD_BOARD_ID=\"sdd154\"
    -DUSER_SETUP_LOADED=1
    -DST7789_2_DRIVER=1
    -DTFT_RGB_ORDER=TFT_RGB
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_CS=15   ; D8
    -DTFT_DC=2    ; D4
    -DTFT_RST=16  ; D0
    -DTFT_BL=0    ; D3 (backlight)
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=27000000
