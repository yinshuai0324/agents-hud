name: esp8266

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "version name, e.g. 0.2.0 (defaults from the tag)"
        required: false

permissions:
  contents: write # upload release assets

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        board: [sdd154] # one entry per [env:<id>] in esp8266/platformio.ini
    steps:
      - uses: actions/checkout@v4

      - name: Compute version
        id: ver
        run: |
          NAME="${{ github.event.inputs.version }}"
          [ -z "$NAME" ] && NAME="${GITHUB_REF_NAME#v}"
          echo "$NAME" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || NAME="0.0.0"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "$NAME" > VERSION # firmware reads the VERSION file at build time

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build firmware (PlatformIO)
        run: |
          pip install platformio
          cd esp8266 && pio run -e ${{ matrix.board }}

      - name: Package firmware zip + manifest
        run: |
          VERSION="${{ steps.ver.outputs.name }}"
          BOARD="${{ matrix.board }}"
          OUT="agents-hud-${VERSION}-esp8266-${BOARD}"
          mkdir -p "$OUT"
          cp "esp8266/.pio/build/${BOARD}/firmware.bin" "$OUT/firmware.bin"
          SHA=$(sha256sum "$OUT/firmware.bin" | awk '{print $1}')
          cat > "$OUT/manifest.json" <<EOF
          {
            "board": "${BOARD}",
            "chip": "esp8266",
            "version": "${VERSION}",
            "flashMode": "dio",
            "flashFreq": "40m",
            "flashSize": "4MB",
            "parts": [
              {"offset": "0x0", "file": "firmware.bin", "sha256": "${SHA}"}
            ]
          }
          EOF
          cat "$OUT/manifest.json"
          (cd "$OUT" && zip -r "../$OUT.zip" .)

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: agents-hud-${{ steps.ver.outputs.name }}-esp8266-${{ matrix.board }}
          path: agents-hud-${{ steps.ver.outputs.name }}-esp8266-${{ matrix.board }}.zip

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: agents-hud-${{ steps.ver.outputs.name }}-esp8266-${{ matrix.board }}.zip
          fail_on_unmatched_files: true
